services:
  present:
    # Built and published by GitHub Actions on every merge to main
    # (.github/workflows/docker-image.yml). To build from this checkout instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/jray222/present:latest
    pull_policy: always
    container_name: present
    ports:
      - "9967:9967"
    environment:
      APP_ENV: development
      FRONTEND_ORIGIN: http://localhost:9967
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9967}
      TZ: ${TZ:-America/Indiana/Indianapolis}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # Optional:
      # WEBAUTHN_RP_ID: yourdomain.com
      # WEBAUTHN_ORIGIN: https://wishlist.yourdomain.com
      # TRUSTED_PROXIES: 127.0.0.1,172.16.0.0/12
      # GOOGLE_CLIENT_ID: ...
      # GOOGLE_CLIENT_SECRET: ...
      # SECRET_KEY: set one here, or let Present generate and persist it in the volume.
    volumes:
      - present-data:/app/backend/data
    restart: unless-stopped

volumes:
  present-data:
